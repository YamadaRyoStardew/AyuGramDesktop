name: Build AyuGram Desktop (Linux Docker)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-linux:
    name: 🐧 Build Linux (Docker)
    runs-on: ubuntu-latest

    steps:
      # 🚀 Maximize disk space FIRST (before checkout!)
      - name: Maximize build disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 512
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies on runner
        run: |
          sudo apt update
          sudo apt install -y \
            python3 \
            python3-pip

      - name: Install Poetry
        run: |
          pip3 install --user poetry
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Prepare Telegram Desktop build environment
        run: |
          ./Telegram/build/prepare/linux.sh

      - name: Build AyuGram Desktop (Release)
        run: |
          docker run --rm \
            -u $(id -u) \
            -v "$PWD:/usr/src/tdesktop" \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=2040 \
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
            -D CMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF

      - name: Strip binaries (optional but recommended)
        run: |
          find out -type f -executable -exec strip --strip-unneeded {} + || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AyuGramDesktop-Linux
          path: out/
